name: mayavi-pr-check
on:
  pull_request:
    types: [opened, edited, synchronize]
jobs:
  pr-body:
    runs-on: ubuntu-latest
    steps:
      - name: Require the Mayavi PR fields
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=0
          for h in "Agent-assisted" "Plan link" "Tests run" "Flag" "Rollback"; do
            if ! printf '%s' "$BODY" | grep -qi "^## $h"; then echo "::error::PR body is missing section: $h"; missing=1; fi
          done
          if printf '%s' "$BODY" | grep -q "<!-- SUMMARY"; then echo "::error::Summary placeholder not replaced"; missing=1; fi
          exit $missing
  # Add your real jobs here too: full tests, lint, secret scanning, claude-code-action review.
  # Make this workflow + tests REQUIRED status checks in branch protection (layer 4).

  naming:
    # Branch name and commit messages, for humans and agents alike (layer 4: server-side).
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.head_ref, 'renovate/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch name is <type>/<user>/<ticket>_<description>
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "$HEAD_REF" | grep -Eq '^(feat|fix|hotfix|chore|refactor|docs|test|perf|ci|build|style)/[a-z0-9][a-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9.-]*_[a-z0-9][a-z0-9-]*$' \
            || { echo "::error::Branch '$HEAD_REF' must look like feat/<user>/PAY-123_short-description"; exit 1; }
      - name: Commits are Conventional Commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          bad=0
          while IFS= read -r subject; do
            case "$subject" in Merge\ *|Revert\ \"*) continue;; esac
            echo "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([A-Za-z0-9._/#,-]+\))?!?: .{1,72}$' \
              || { echo "::error::Not a Conventional Commit: $subject"; bad=1; }
          done < <(git log --format=%s "origin/$BASE_REF..HEAD")
          exit $bad
